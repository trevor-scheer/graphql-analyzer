name: Package previews

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pkg-pr-new-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Preview Scope
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.changed.outputs.preview }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  build-core:
    name: Build core (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.preview == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm_dir: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            npm_dir: darwin-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm_dir: linux-arm64-gnu
            linux_cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm_dir: linux-x64-gnu
            dispatcher: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm_dir: win32-x64-msvc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        run: rustup show

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "preview-core-${{ matrix.target }}"

      - name: Setup mise + pnpm
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          experimental: true

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Install Linux ARM cross toolchain
        if: matrix.linux_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build native addon
        working-directory: packages/core
        run: pnpm exec napi build --manifest-path ../../crates/napi/Cargo.toml --output-dir . --platform --release --target ${{ matrix.target }}

      - name: Upload .node binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-bindings-${{ matrix.npm_dir }}
          path: packages/core/graphql-analyzer.*.node
          if-no-files-found: error

      - name: Upload dispatcher entry points
        if: matrix.dispatcher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-dispatcher
          path: |
            packages/core/index.js
            packages/core/index.d.ts
          if-no-files-found: error

  publish:
    name: Publish package previews
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup mise + pnpm
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          experimental: true

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Download .node bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: core-bindings-*
          path: napi-artifacts
          merge-multiple: true

      - name: Download dispatcher entry points
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dispatcher
          path: packages/core

      - name: Distribute bindings into platform packages
        working-directory: packages/core
        run: pnpm exec napi artifacts --output-dir ../../napi-artifacts

      - name: Build ESLint plugin
        run: pnpm --filter @graphql-analyzer/eslint-plugin run build

      - name: Publish all npm packages together
        run: >-
          pnpm exec pkg-pr-new publish
          --previewVersion
          --no-template
          './packages/core/npm/*'
          './packages/core'
          './packages/eslint-plugin'
